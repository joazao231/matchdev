spring.application.name=MatchDev
spring.profiles.default=dev

spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

security.jwt.secret=${JWT_SECRET:matchdev-development-secret-key-change-before-production}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

matchdev.automation.initial-delay-ms=${MATCH_INITIAL_DELAY_MS:60000}
matchdev.automation.interval-ms=${MATCH_INTERVAL_MS:1800000}

services.resume-parser.url=${RESUME_PARSER_URL:http://localhost:8000}

matchdev.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.openai.site}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
